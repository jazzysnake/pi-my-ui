# The Caddy half of the phone path: TLS on the tailnet, the client bundle, and the proxy to the
# server, which runs from node on the host (docs/deploy/server.md). Machine values live in .env
# beside this file; nothing here names a machine, a path or a Project.
#
# Host networking so Caddy keeps binding the tailnet addresses only, which is what makes "reachable
# from the tailnet only" true at the socket, and so its upstream is the loopback server.

name: pi-my-ui

services:
  caddy:
    image: caddy:2
    network_mode: host
    # Comes back after a reboot (with docker.service enabled) and after a crash, and stays stopped
    # when you stop it by hand.
    restart: unless-stopped
    environment:
      # The Caddyfile reads every machine value from here, so the file itself is the same everywhere.
      PI_MY_UI_REPO: ${PI_MY_UI_REPO}
      PI_MY_UI_PORT: ${PI_MY_UI_PORT}
      PI_MY_UI_TAILNET_NAME: ${PI_MY_UI_TAILNET_NAME}
      PI_MY_UI_TAILNET_IPV4: ${PI_MY_UI_TAILNET_IPV4}
      PI_MY_UI_TAILNET_IPV6: ${PI_MY_UI_TAILNET_IPV6}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The built client bundle, read-only: the host build stays the only thing that writes it.
      - ${PI_MY_UI_REPO}:${PI_MY_UI_REPO}:ro
      # Caddy's local CA and its certificates. Deleting this volume mints a new root CA that every
      # device has to trust again, so it is durable state, not a cache.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
